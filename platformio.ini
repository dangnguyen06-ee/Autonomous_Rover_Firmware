[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200

[env:rover]
build_src_filter = -<*> -<test/>

[env:test_bno085]
build_src_filter = -<*> +<tests/test_bno085.cpp>
lib_deps =
    adafruit/Adafruit BNO08x @ ^1.2.5

[env:test_i2c]
build_src_filter = -<*> +<tests/test_i2c.cpp>
lib_deps =
    robtillaart/TCA9548@^0.3.2
    adafruit/Adafruit VL53L5CX@^1.0.1
    adafruit/Adafruit VEML7700 Library@^2.1.6
    https://github.com/markwal/RCWL_1601_i2c.git

[env:test_tof_stream]
build_src_filter = -<*> +<tests/test_tof_stream.cpp>
lib_deps =
    robtillaart/TCA9548@^0.3.2
    adafruit/Adafruit VL53L5CX@^1.0.1

[env:test_sensors]
build_src_filter = -<*> +<tests/test_sensors.cpp>
lib_deps =
    robtillaart/TCA9548@^0.3.2
    adafruit/Adafruit VL53L5CX@^1.0.1
    adafruit/Adafruit VEML7700 Library@^2.1.6

[env:test_servo]
build_src_filter = -<*> +<tests/test_servo.cpp>
lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.5

[env:test_motors]
build_src_filter = -<*> +<tests/test_motors.cpp>
lib_deps =
    1337encrypted/BTS7960_Motordriver@^1.0.0

[env:test_estop]
build_src_filter = -<*> +<tests/test_estop.cpp>
lib_deps =
    1337encrypted/BTS7960_Motordriver@^1.0.0
    robtillaart/TCA9548@^0.3.2
    adafruit/Adafruit VL53L5CX@^1.0.1
    adafruit/Adafruit VEML7700 Library@^2.1.6

[env:test_roverweb]
build_src_filter = -<*> +<tests/test_roverweb.cpp>
lib_deps =
    1337encrypted/BTS7960_Motordriver@^1.0.0

[env:test_nodrift]
build_src_filter = -<*> +<tests/test_nodrift.cpp>
lib_deps =
    1337encrypted/BTS7960_Motordriver@^1.0.0
    adafruit/Adafruit BNO08x @ ^1.2.5
