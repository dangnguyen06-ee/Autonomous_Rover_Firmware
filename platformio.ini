[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
 
[env:bno085]
build_src_filter = -<*> +<test_bno085.cpp>
lib_deps =
    adafruit/Adafruit BNO08x @ ^1.2.5
 
[env:vl53l5cx]
build_src_filter = -<*> +<test_vl53l5cx.cpp>
lib_deps =
    sparkfun/SparkFun VL53L5CX Arduino Library
 
[env:vl53l5cx_x3]
build_src_filter = -<*> +<test_vl53l5cx_x3.cpp>
lib_deps =
    sparkfun/SparkFun VL53L5CX Arduino Library
 